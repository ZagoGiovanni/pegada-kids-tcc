
name: CI - Pegada Kids TCC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Verificar Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3333
          NEXT_PUBLIC_TCC_DEMO_MODE: "true"

  backend:
    name: Verificar Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Compilar TypeScript
        run: npm run build
